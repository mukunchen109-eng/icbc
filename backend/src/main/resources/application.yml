server:
  port: 8080
spring:
  application:
    name: financial-intelligence-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  jackson:
    time-zone: Asia/Shanghai
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.icbc.financialinfo.modules
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoint:
    health:
      show-details: always
app:
  collection:
    cron: "0 0 9 * * *"
  archive:
    retention-days: 30
  report:
    output-dir: target/generated-reports
    news-table: news_pool
    report-table: report
    report-article-table: report_article
    dify:
      base-url: https://api.dify.ai
      api-key: app-wYZsUDq3HLASFrHQOuuk5VXD
      endpoint: /v1/workflows/run
      response-mode: blocking
      user: report-module
      mock-enabled: false
